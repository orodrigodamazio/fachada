version: "3.8"

services:
  app:
    image: ghcr.io/orodrigodamazio/fachada:local-1779226014
    networks:
      - gmnet
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_ROOT_DOMAINS: ${NEXT_PUBLIC_ROOT_DOMAINS}
      NEXT_PUBLIC_APP_HOSTS: ${NEXT_PUBLIC_APP_HOSTS}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      NEXT_PUBLIC_CDN_HOSTNAME: ${NEXT_PUBLIC_CDN_HOSTNAME:-}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      labels:
        traefik.enable: "true"
        traefik.docker.network: "gmnet"
        traefik.http.services.fachada-app.loadbalancer.server.port: "3000"

        traefik.http.routers.fachada-apex.entrypoints: "websecure"
        traefik.http.routers.fachada-apex.rule: "Host(`${ROOT_DOMAIN}`) || Host(`www.${ROOT_DOMAIN}`)"
        traefik.http.routers.fachada-apex.tls: "true"
        traefik.http.routers.fachada-apex.tls.certresolver: "letsencryptresolver"
        traefik.http.routers.fachada-apex.service: "fachada-app"

        traefik.http.routers.fachada-admin.entrypoints: "websecure"
        traefik.http.routers.fachada-admin.rule: "Host(`admin.${ROOT_DOMAIN}`)"
        traefik.http.routers.fachada-admin.tls: "true"
        traefik.http.routers.fachada-admin.tls.certresolver: "letsencryptresolver"
        traefik.http.routers.fachada-admin.service: "fachada-app"

        traefik.http.routers.fachada-wild.entrypoints: "websecure"
        traefik.http.routers.fachada-wild.rule: "HostRegexp(`^[a-z0-9-]+\\.${ROOT_DOMAIN_ESCAPED}$$`)"
        traefik.http.routers.fachada-wild.tls: "true"
        traefik.http.routers.fachada-wild.tls.certresolver: "letsencryptresolver"
        traefik.http.routers.fachada-wild.service: "fachada-app"

networks:
  gmnet:
    external: true
