name: smoke-test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ghcr.io/orodrigodamazio/fachada:latest

      - name: Inspect size
        run: |
          SIZE=$(docker inspect ghcr.io/orodrigodamazio/fachada:latest --format '{{.Size}}')
          MB=$((SIZE / 1024 / 1024))
          echo "IMAGE_SIZE_MB=$MB" | tee -a $GITHUB_ENV
          echo "Image size: ${MB} MB (${SIZE} bytes)"

      - name: Inspect config
        run: |
          docker inspect ghcr.io/orodrigodamazio/fachada:latest \
            --format 'CMD={{.Config.Cmd}} ENTRYPOINT={{.Config.Entrypoint}} USER={{.Config.User}} WORKDIR={{.Config.WorkingDir}} EXPOSED={{.Config.ExposedPorts}}'
          echo "--- Healthcheck ---"
          docker inspect ghcr.io/orodrigodamazio/fachada:latest --format '{{json .Config.Healthcheck}}'

      - name: Run smoke container
        run: |
          docker run --rm -d --name fachada-smoke -p 3001:3000 \
            -e DATABASE_URL='postgresql://invalid:invalid@invalid:5432/db' \
            ghcr.io/orodrigodamazio/fachada:latest
          sleep 8

      - name: Container status
        run: |
          docker ps -a --filter name=fachada-smoke --format '{{.Names}} {{.Status}} {{.Ports}}'

      - name: Curl home
        run: |
          set +e
          curl -v -m 10 http://localhost:3001/ 2>&1 | head -40
          echo "---"
          echo "HTTP code: $(curl -s -o /dev/null -w '%{http_code}' -m 10 http://localhost:3001/)"

      - name: Container logs
        if: always()
        run: docker logs fachada-smoke 2>&1 | tail -40 || true

      - name: Cleanup
        if: always()
        run: docker stop fachada-smoke 2>/dev/null || true
